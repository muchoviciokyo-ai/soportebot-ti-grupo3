<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="utf-8">
  <style>
    :root {
      --primario: <?= bot.colores.primario ?>;
      --acento: <?= bot.colores.acento ?>;
      --fondo: <?= bot.colores.fondo ?>;
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: "Segoe UI", Roboto, Arial, sans-serif; background: var(--fondo); color: #1c2733; }
    .app { max-width: 720px; height: 100vh; margin: 0 auto; display: flex; flex-direction: column; background: #fff; box-shadow: 0 0 24px rgba(0,0,0,.08); }
    header { background: var(--primario); color: #fff; padding: 14px 18px; display: flex; align-items: center; gap: 12px; }
    .avatar { width: 42px; height: 42px; border-radius: 50%; background: var(--acento); display: grid; place-items: center; font-size: 22px; }
    header h1 { font-size: 18px; margin: 0; }
    header p { font-size: 12px; margin: 2px 0 0; opacity: .85; }
    #chat { flex: 1; overflow-y: auto; padding: 18px; display: flex; flex-direction: column; gap: 10px; }
    .msg { max-width: 85%; padding: 10px 14px; border-radius: 14px; line-height: 1.45; white-space: pre-line; font-size: 14px; }
    .bot { background: var(--fondo); align-self: flex-start; border-bottom-left-radius: 4px; }
    .user { background: var(--primario); color: #fff; align-self: flex-end; border-bottom-right-radius: 4px; }
    .tag { display: inline-block; font-size: 11px; font-weight: 600; color: var(--primario); background: #fff; border: 1px solid var(--acento); border-radius: 999px; padding: 1px 8px; margin-bottom: 6px; }
    .botones { display: flex; flex-wrap: wrap; gap: 8px; padding: 10px 18px; border-top: 1px solid #e3eaf2; }
    .botones button { border: 1px solid var(--acento); background: #fff; color: var(--primario); border-radius: 999px; padding: 7px 12px; font-size: 13px; cursor: pointer; }
    .botones button:hover { background: var(--acento); color: #fff; }
    form { display: flex; gap: 8px; padding: 12px 18px 16px; }
    input { flex: 1; padding: 11px 14px; border: 1px solid #c9d6e3; border-radius: 999px; font-size: 14px; outline: none; }
    input:focus { border-color: var(--acento); }
    form button { background: var(--primario); color: #fff; border: 0; border-radius: 999px; padding: 0 18px; font-size: 14px; cursor: pointer; }
    form button:disabled { opacity: .5; }
    footer { font-size: 11px; color: #6b7a89; text-align: center; padding: 0 18px 10px; }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <div class="avatar">🤖</div>
      <div>
        <h1><?= bot.nombre ?></h1>
        <p><?= bot.subtitulo ?></p>
      </div>
    </header>
    <div id="chat"></div>
    <div class="botones" id="botones"></div>
    <form id="form">
      <input id="entrada" autocomplete="off" placeholder="Escribe tu consulta…" maxlength="500">
      <button id="enviar" type="submit">Enviar</button>
    </form>
    <footer>Datos y políticas ficticios. El bot solo orienta: no ejecuta trámites ni consulta estados reales.</footer>
  </div>

  <script>
    const BOT = <?!= JSON.stringify(bot) ?>;
    const chat = document.getElementById('chat');
    const entrada = document.getElementById('entrada');
    const enviar = document.getElementById('enviar');

    function agregar(texto, clase, categoria) {
      const div = document.createElement('div');
      div.className = 'msg ' + clase;
      if (categoria) {
        const tag = document.createElement('span');
        tag.className = 'tag';
        tag.textContent = categoria;
        div.appendChild(tag);
        div.appendChild(document.createElement('br'));
      }
      div.appendChild(document.createTextNode(texto));
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
      return div;
    }

    function consultar(texto) {
      texto = texto.trim();
      if (!texto) return;
      agregar(texto, 'user');
      entrada.value = '';
      enviar.disabled = true;
      const escribiendo = agregar('Escribiendo…', 'bot');
      google.script.run
        .withSuccessHandler(function (r) {
          escribiendo.remove();
          if (r) agregar(r.respuesta, 'bot', r.categoria);
          enviar.disabled = false;
          entrada.focus();
        })
        .withFailureHandler(function () {
          escribiendo.remove();
          agregar('Ocurrió un error al registrar tu consulta. Inténtalo nuevamente.', 'bot');
          enviar.disabled = false;
        })
        .procesarConsulta(texto);
    }

    BOT.botones.forEach(function (b) {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.textContent = b.etiqueta;
      btn.onclick = function () { consultar(b.consulta); };
      document.getElementById('botones').appendChild(btn);
    });

    document.getElementById('form').addEventListener('submit', function (e) {
      e.preventDefault();
      consultar(entrada.value);
    });

    agregar(BOT.bienvenida, 'bot');
  </script>
</body>
</html>
